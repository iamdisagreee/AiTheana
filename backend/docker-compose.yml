services:
  pg:
    image: postgres:latest
    env_file:
      - ./.env
    container_name: pg
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - 5433:5432
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - ./.env
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - 6380:6379
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastapi:
    build: .
    env_file:
      - ./.env
    container_name: fastapi
    ports:
      - 8000:8000
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: on-failure

  celery_worker:
    build: .
    env_file:
      - ./.env
    container_name: celery_worker
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery.celery_app worker --loglevel=info
    restart: on-failure

volumes:
  pg_data:
  redis_data:
