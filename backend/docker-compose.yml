services:
  backend_pg:
    image: postgres:latest
    env_file:
      - ./.env
    container_name: backend_pg
    volumes:
      - backend_pg_data:/var/lib/postgresql
    ports:
      - 5432:5432
    restart: on-failure

  backend_redis:
    image: redis:latest
    env_file:
      - ./.env
    container_name: backend_redis
    volumes:
      - backend_redis_data:/data
    ports:
      - 6379:6379
    restart: on-failure

volumes:
  backend_pg_data:
  backend_redis_data:
